  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ponentDidMount(){\n    const SHEET_ID='1K6WUxncClRoJHHmyYKk1UxmS6snqEYCvospB6iHlt04';\n    const AS_URL='https://script.google.com/macros/s/AKfycbzQ4MYa4I-6-mGmrkAQVyxBYHWwijlAnf3-ZWoOzZ6nbb2G-5p8udmj4VfatKEHkvCL/exec';\n    let DATA=[],charts={c:null,d:null,l:null};\n    const $=id=>document.getElementById(id);\n\n    const LR=[\n      \"Rachit is studying sport science and nutrition. He can name the exact muscle group he's refusing to use and the precise macros he's failing to walk off. The knowledge is elite. The application is non-existent.\",\n      \"He's literally studying how the human body is supposed to move — then he closes the textbook and proves the entire field wrong from a seated position.\",\n      \"Rachit loves a good challenge. Except this one. The one with his name on it. The one he is currently losing to someone in Pune who Ubers 2km.\",\n      \"Rachit loves learning about AI. He could build an agent to log his steps, automate his step count, and optimise his route. He cannot build one to actually take the steps.\",\n      \"His ex cheated on him. Brutal. But honestly, the way his own step count betrays him daily is starting to look like the bigger act of disloyalty.\",\n      \"A sport science student losing a walking challenge is like a chef losing a toast competition. The expertise is right there. The execution has left the building.\",\n      \"You track TACoS, RoAS, CAC across 15 SKUs with surgical precision. Your step count is performing at RTO quality. 0% delivered. Return to origin: the couch.\",\n      \"You built Meta Ads master prompts using Hook Model and 3C Framework logic. None of that logic is being applied to moving your feet forward.\",\n      \"You write long, deeply expressive messages about life and connection. None of them said 'I walked 10,000 steps today.' The leaderboard noticed.\",\n      \"Rachit went on a bike ride and called it cardio. The challenge is about steps, not stories.\",\n      \"Nova Bloom sells a Bio-Collagen Overnight Glass Skin Mask. No amount of collagen can restore the dignity of this step count.\",\n      \"Your Folk Creations watch organiser holds 10 watches. None of those watches are counting enough steps on your wrist.\",\n      \"You built a full Supabase-backed brain dump app with a 12-week heatmap. Your step heatmap looks like a server outage.\",\n      \"Rachit loves deep conversations. He and Anushka Ji are having one — it's this leaderboard, and she's the only one saying something meaningful.\",\n      \"You track 136g protein daily to the gram. Your steps, by contrast, have not been tracked, hit, or acknowledged.\",\n      \"Claude can run your Amazon automation. Claude cannot run your legs. That remains entirely on you.\",\n      \"7 years. One relationship. Ended badly. And now he won't even let his step count commit to a number above 8,000.\",\n      \"Rachit does not want to get married. He also apparently does not want to walk. A man committed to his own peace and couch.\",\n      \"Mumbai: a city where people walk everywhere. Rachit: a person from Mumbai losing a walking challenge to someone from Pune who Ubers 2km.\",\n      \"Every morning Rachit eats misal pav and feels powerful. The misal is not converting to steps. Investigate.\",\n      \"You optimise everyone else's funnel. Your own conversion from 'sofa' to 'standing' is the worst-performing metric in your entire portfolio.\",\n      \"A D2C founder who can scale a brand to crore but cannot scale his own legs past the bedroom door. The unit economics of your fitness are negative.\",\n      \"You debug other people's code for a living. The bug in your step count has been in production for the entire month and you refuse to even open the ticket.\"\n    ];\n    const LA=[\n      \"Anushka Ji is a Senior QA Automation Engineer. Her job is literally to find failures. And yet she cannot QA her own step count, which is failing all test cases.\",\n      \"She does makeup artistry on the side. Full contour, highlight, setting spray — then sits down. The fit is immaculate. The step count is not.\",\n      \"Anushka Ji's makeup looks take 2 hours. Her daily walk takes 20 minutes. The priorities are documented and they are concerning.\",\n      \"Anushka Ji lives in Pune and claims it's better than Mumbai. Pune has wider roads, cleaner air, and apparently zero reason to walk anywhere.\",\n      \"Pune has Mulshi, Sinhagad, Lavasa — literally surrounded by trekking hills. Anushka Ji is not trekking any of them. She is on her couch defending Pune's honour without using her legs.\",\n      \"The pani puri stalls near FC Road are already practising lockout procedures. In advance. With quiet certainty.\",\n      \"Anushka Ji's 3 past relationships all ended, but none of them hurt as much as what is about to happen to her and pani puri.\",\n      \"Her father builds aluminium windows and glass structures. He is going to have to build a glass case to display the last pani puri she ate before the ban.\",\n      \"Shreenidhi, Hrutuja, Shivani, and Shweta are all watching from Pune. None of them are helping. None of them are walking with her.\",\n      \"Shivani still goes to the gym. Shivani is the only one with athletic credibility. The rest of the group, including Anushka Ji, are a collective liability.\",\n      \"Anushka Ji is looking for marriage prospects. Any prospect watching this leaderboard is reconsidering.\",\n      \"Height 5'8\\\". Senior QA Engineer. Makeup artist. Excellent on paper. Step count: needs improvement. Marriage prospects are watching.\",\n      \"Anushka Ji writes automated test cases for bugs. Her step count has had a critical bug since Day 1. No ticket has been opened.\",\n      \"Baner Road traffic is Anushka Ji's reason for not walking. Her step count suggests she is not walking inside her own apartment either.\",\n      \"At Anushka's current pace, Rachit could take a full weekend off and still win comfortably.\",\n      \"She QA-tests :#e11d48\">'+(aT*.0008).toFixed(1)+'<\u002Fspan>km';\n\n      // Humiliation\n      const hc=$('hum');\n      if(rT>0&&aT>0&&ldr!=='tie'){hc.style.display='block';\n        if(ldr==='rachit'){$('hum-avi').textContent='🚶‍♀️';$('hum-name').textContent='Anushka Ji';$('hum-roast').textContent=srnd(LA);}\n        else{$('hum-avi').textContent='🏃';$('hum-name').textContent='Rachit';$('hum-roast').textContent=srnd(LR);}\n      }else hc.style.display='none';\n\n      // Daily champ\n      const lt=DATA[DATA.length-1],dc=$('dc');\n      if(lt.r>lt.a){dc.style.background='linear-gradient(135deg,#0c4a6e,#0369a1,#0284c7)';$('dc-bg').textContent='R';$('dc-med').textContent='🔵';$('dc-txt').textContent='\"'+srnd(DR)+'\"';$('dc-sub').innerHTML=lt.date.slice(5)+' · <strong>Rachit won by '+fmt(lt.r-lt.a)+' steps<\u002Fstrong>';}\n      else if(lt.a>lt.r){dc.style.background='linear-gradient(135deg,#4c0519,#9f1239,#e11d48)';$('dc-bg').textContent='A';$('dc-med').textContent='🔴';$('dc-txt').textContent='\"'+srnd(DA)+'\"';$('dc-sub').innerHTML=lt.date.slice(5)+' · <strong>Anushka Ji won by '+fmt(lt.a-lt.r)+' steps<\u002Fstrong>';}\n      else{dc.style.background='linear-gradient(135deg,#1e293b,#334155)';$('dc-bg').textContent='=';$('dc-med').textContent='⚖️';$('dc-txt').textContent='\"A dead heat. Pathetic from both. Pune and Mumbai equally embarrassed.\"';$('dc-sub').innerHTML=lt.date.slice(5)+' · <strong>Tie. The worst possible outcome.<\u002Fstrong>';}\n\n      // Shame\n      const LQ=['\"A number so small it\\'s basically decorative.\"','\"Fewer steps than a toddler at IKEA.\"','\"The Fitbit wept when it recorded this.\"','\"Historically low. Medically concerning. Personally embarrassing.\"'];\n      const SQ=['\"Days where the only movement was scrolling this leaderboard.\"','\"Fewer steps than the walk to the bathroom.\"','\"Scientists baffled. Doctors worried. Rivals thrilled.\"'];\n      const MQ=['\"The math doesn\\'t care about your feelings.\"','\"A number that increases dai ion renderWanted(rT,aT,ldr,diff,rSl,aSl,n){\n      const w=$('wanted-w');\n      if(!n||ldr==='tie'){w.style.display='none';return;}\n      w.style.display='flex';\n      const isR=ldr==='anushka';const nm=isR?'Rachit':'Anushka Ji';\n      const tot=isR?rT:aT;const sl=isR?rSl:aSl;const avg=n?Math.round(tot/n):0;\n      const dL=Math.max(0,30-n);const cu=dL>0?Math.ceil(diff/dL):0;\n      $('wp-ph').textContent=isR?'🏃':'🚶‍♀️';\n      $('wp-name').textContent=nm;\n      $('wp-alias').textContent=rnd(isR?WPA_R:WPA_A);\n      $('wp-ch').textContent=rnd(isR?WPC_R:WPC_A);\n      const st=$('wp-stamp');\n      st.textContent=diff>10000?'GUILTY':'SUSPECT';\n      st.style.color=diff>10000?'rgba(127,29,29,.48)':'rgba(180,83,9,.48)';\n      st.style.borderColor=diff>10000?'rgba(127,29,29,.38)':'rgba(180,83,9,.38)';\n      const sc=(v,l,c)=>'<div style=\"background:rgba(139,105,20,.07);border:1px solid rgba(139,105,20,.18);border-radius:5px;padding:7px\"><div style=\"font:900 1rem/1 \\'Outfit\\';color:'+(c||'#1a1a1a')+'\">'+v+'<\u002Fdiv><div style=\"font:800 .55rem/1 \\'Outfit\\';text-transform:uppercase;letter-spacing:.8px;color:#8b6914;margin-top:3px\">'+l+'<\u002Fdiv><\u002Fdiv>';\n      $('wp-sg').innerHTML=sc(fmt(tot),'Total Steps')+sc('−'+fmt(diff),'Deficit','#7f1d1d')+sc(fmt(avg),'Avg/Day')+sc('+'+fmt(cu)+'/d','Miracle Req.','#7f1d1d')+sc(sl,'Pathetic Days')+sc(dL,'Days Left');\n    }\n\n    function renderRivalry(){\n      const mW=DATA.filter(d=>d.r>d.a).length,pW=DATA.filter(d=>d.a>d.r).length;\n      $('rv-mum').textContent=mW;$('rv-pun').textContent=pW;\n      const t2=mW+pW||1;const mP=Math.round(mW/t2*100),pP=100-mP;\n      $('rv-bm').style.width=mP+'%';$('rv-bp').style.width=pP+'%';\n      $('rv-pct').textContent=mP+'% / '+pP+'%';\n      $('rv-mid-sc').textContent=mW>pW?'🏙️ Mumbai '+mW+'–'+pW:pW>mW?'🌿 Pune '+pW+'–'+mW:'⚖️ '+mW+'–'+pW;\n      $('rv-roast').textContent=mW>pW?srnd(RVM):pW>mW?srnd(RVP):srnd(RVT);\n    }\n\n    function whenChart(cb){if(window.Chart){cb();}else{const t=setInterval(()=>{if(window.Chart){clearInterval(t);cb();}},60);}}\n    function renderCharts(){\n      whenChart(()=>{\n        const labs=DATA.map(d=>d.date.slice(5));const rD=DATA.map(d=>d.r);const aD=DATA.map(d=>d.a);\n        let rc=0,ac=0;const rC=DATA.map(d=>{rc+=d.r;return rc;});const aC=DATA.map(d=>{ac+=d.a;return ac;});\n        const net=DATA.map(d=>d.r-d.a);\n        Chart.defaults.font.family=\"'Plus Jakarta Sans',sans-serif\";Chart.defaults.color='#64748b';\n        if(charts.c)charts.c.destroy();if(charts.d)charts.d.destroy();if(charts.l)charts.l.destroy();\n        const gR=$('chartCum').getContext('2d');const g1=gR.createLinearGradient(0,0,0,240);g1.addColorStop(0,'rgba(2,132,199,.2)');g1.addColorStop(1,'rgba(2,132,199,.01)');const g2=gR.createLinearGradient(0,0,0,240);g2.addColorStop(0,'rgba(225,29,72,.2)');g2.addColorStop(1,'rgba(225,29,72,.01)');\n        charts.c=new Chart(gR,{type:'line',data:{labels:labs,datasets:[{label:'Rachit',data:rC,borderColor:'#0284c7',backgroundColor:g1,fill:true,tension:.4,borderWidth:3,pointRadius:3,pointBackgroundColor:'#0284c7'},{label:'Anushka Ji',data:aC,borderColor:'#e11d48',backgroundColor:g2,fill:true,tension:.4,borderWidth:3,pointRadius:3,pointBackgroundColor:'#e11d48'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12,font:{size:11}}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:v=>v>=1000?Math.round(v/1000)+'k':v}}}}});\n        const gD=$('chartDay').getContext('2d');\n        charts.d=new Chart(gD,{type:'bar',data:{labels:labs,datasets:[{label:'Rachit',data:rD,backgroundColor:'rgba(2,132,199,.75)',hoverBackgroundColor:'#0284c7',borderRadius:5,borderSkipped:false},{label:'Anushka Ji',data:aD,backgroundColor:'rgba(225,29,72,.75)',hoverBackgroundColor:'#e11d48',borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom',labels:{boxWidth:12,padding:12,font:{size:11}}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{font:{size:10},callback:v=>v>=1000?Math.round(v/1000)+'k':v}}}}});\n        const gL=$('chartLead').getContext('2d');\n        charts.l=new Chart(gL,{type:'bar',data:{labels:labs,datasets:[{label:'Net (R − A)',data:net,backgroundColor:net.map(v=>v>=0?'rgba(2,132,199,.8)':'rgba(225,29,72,.8)'),borderRadius:5,borderSkipped:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>(c.raw>=0?'Rachit +':'Anushka +')+fmt(Math.abs(c.raw))}}},scales:{x:{grid:{display:false},ticks:{font:{size:10}}},y:{grid:{color:'rgba(0,0,0,.06)'},ticks:{font:{size:10},callback:v=>v>=1000||v<=-1000?Math.round(v/1000)+'k':v}}}}});\n      });\n    }\n\n    function confetti(){const cs=['#0284c7','#38bdf8','#e11d48','#fb7185','#f59e0b','#10b981','#8b5cf6'];for(let i=0;i<50;i++){const p=document.createElement('div');const sz=6+Math.random()*8;p.style.cssText='position:fixed;pointer-events:none;z-index:1000;border-radius:3px;left:'+(Math.random()*100)+'vw;top:-10px;width:'+sz+'px;height:'+sz+'px;background:'+cs[~~(Math.random()*cs.length)]+';transform:rotate('+(Math.random()*360)+'deg);animation:cf '+(1.5+Math.random()*2)+'s linear '+(Math.random()*.8)+'s forwards';document.body.appendChild(p);setTimeout(()=>p.remove(),4000);}}\n\n    let tT;function toast(m,bg){const t=$('toast');t.textContent=m;t.style.background=bg||'#0b1220';t.style.transform='translateX(-50%) translateY(0)';clearTimeout(tT);tT=setTimeout(()=>{t.style.transform='translateX(-50%) translateY(110px)';},3000);}\n\n    // ── RACE REPLAY ──\n    let rrPlaying=false;\n    function playReplay(){\n      if(!DATA.length){toast('No battle data yet','#ef4444');return;}\n      if(rrPlaying)return;rrPlaying=true;\n      const btn=$('rr-btn');btn.textContent='■  Playing…';\n      let rc=0,ac=0;const rC=DATA.map(d=>{rc+=d.r;return rc;});const aC=DATA.map(d=>{ac+=d.a;return ac;});\n      const maxF=Math.max(rC[rC.length-1],aC[aC.length-1])||1;const n=DATA.length;\n      let rw=0,aw=0,i=0;\n      $('rr-r-fill').style.width='0%';$('rr-a-fill').style.width='0%';$('rr-r-runner').style.left='0%';$('rr-a-runner').style.left='0%';$('rr-r-val').textContent='0';$('rr-a-val').textContent='0';\n      const stepMs=Math.max(170,Math.min(450,Math.round(9000/n)));\n      const iv=setInterval(()=>{\n        const d=DATA[i],rcum=rC[i],acum=aC[i];\n        if(d.r>d.a)rw++;else if(d.a>d.r)aw++;\n        const rp=rcum/maxF*100,ap=acum/maxF*100;\n        $('rr-r-fill').style.width=rp+'%';$('rr-r-runner').style.left=rp+'%';\n        $('rr-a-fill').style.width=ap+'%';$('rr-a-runner').style.left=ap+'%';\n        $('rr-r-val').textContent=fmt(rcum);$('rr-a-val').textContent=fmt(acum);\n        $('rr-day').textContent='Day '+(i+1)+' · '+d.date.slice(5);\n        $('rr-score').textContent='Wins   R '+rw+' – '+aw+' A';\n        i++;\n        if(i>=n){clearInterval(iv);rrPlaying=false;\n          const fl=rC[n-1]>aC[n-1]?'Rachit':aC[n-1]>rC[n-1]?'Anushka Ji':'Tie';\n          $('rr-score').textContent=fl==='Tie'?'⚖️ Dead heat':'🏆 '+fl+' takes the month';\n          btn.textContent='↻  Replay';confetti();\n        }\n      },stepMs);\n    }\n\n    // ── SHAREABLE BATTLE CARD ──\n    const val=id=>{const e=$(id);return e?e.textContent.trim():'';};\n    function rrect(x,xx,yy,w,h,r){x.beginPath();x.moveTo(xx+r,yy);x.arcTo(xx+w,yy,xx+w,yy+h,r);x.arcTo(xx+w,yy+h,xx,yy+h,r);x.arcTo(xx,yy+h,xx,yy,r);x.arcTo(xx,yy,xx+w,yy,r);x.closePath();}\n    function wrapLines(x,t,max){const ws=(t||'').split(' ');const out=[];let ln='';ws.forEach(w=>{const tt=ln?ln+' '+w:w;if(x.measureText(tt).width>max&&ln){out.push(ln);ln=w;}else ln=tt;});if(ln)out.push(ln);return out;}\n    async function buildBattleCard(){\n      if(!DATA.length){toast('No battle data yet','#ef4444');return;}\n      try{await document.fonts.ready;}catch(e){}\n      const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');\n      const bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#0b1220');bg.addColorStop(.6,'#101626');bg.addColorStop(1,'#1a1020');x.fillStyle=bg;x.fillRect(0,0,W,H);\n      const g1=x.createRadialGradient(170,140,0,170,140,560);g1.addColorStop(0,'rgba(2,132,199,.2)');g1.addColorStop(1,'rgba(2,132,199,0)');x.fillStyle=g1;x.fillRect(0,0,W,H);\n      const g2=x.createRadialGradient(W-170,H-180,0,W-170,H-180,560);g2.addColorStop(0,'rgba(225,29,72,.2)');g2.addColorStop(1,'rgba(225,29,72,0)');x.fillStyle=g2;x.fillRect(0,0,W,H);\n      x.strokeStyle='rgba(245,158,11,.9)';x.lineWidth=5;x.strokeRect(26,26,W-52,H-52);\n      x.fillStyle='#f59e0b';x.fillRect(26,26,W-52,10);\n      x.textAlign='center';x.textBaseline='alphabetic';\n      x.fillStyle='#facc15';x.font='800 28px \"Outfit\",sans-serif';x.fillText('⚔   B A T T L E   R E P O R T   ⚔',W/2,130);\n      x.fillStyle='#fff';x.font='900 74px \"Outfit\",sans-serif';x.fillText('THE GREAT',W/2,214);\n      (function(){const segs=[['JUNE ','#38bdf8'],['WALK ','#ffffff'],['WAR','#fb7185']];x.font='900 74px \"Outfit\",sans-serif';let tot=0;segs.forEach(s=>tot+=x.measureText(s[0]).width);let sx=W/2-tot/2;x.textAlign='left';segs.forEach(s=>{x.fillStyle=s[1];x.fillText(s[0],sx,292);sx+=x.measureText(s[0]).width;});x.textAlign='center';})();\n      x.fillStyle='#94a3b8';x.font='700 26px \"Plus Jakarta Sans\",sans-serif';x.fillText(val('sb-day').toUpperCase(),W/2,340);\n      const ldr=window._ldr||'tie';\n      function fighter(cx,emoji,name,color,total,lead){\n        if(lead){x.font='58px \"Outfit\",sans-serif';x.fillText('👑',cx,452);}\n        x.font='114px \"Outfit\",sans-serif';x.fillText(emoji,cx,560);\n        x.fillStyle=color;x.font='800 34px \"Outfit\",sans-serif';x.fillText(name,cx,612);\n        x.fillStyle='#fff';x.font='900 86px \"Outfit\",sans-serif';x.fillText(total,cx,702);\n        x.fillStyle='#64748b';x.font='800 22px \"Outfit\",sans-serif';x.fillText('TOTAL STEPS',cx,736);\n      }\n      fighter(300,'🏃','RACHIT','#38bdf8',val('sb-r-tot'),ldr==='rachit');\n      fighter(780,'🚶‍♀️','ANUSHKA JI','#fb7185',val('sb-a-tot'),ldr==='anushka');\n      x.beginPath();x.arc(W/2,542,54,0,Math.PI*2);x.fillStyle='#0b1220';x.fill();x.lineWidth=3;x.strokeStyle='rgba(245,158,11,.6)';x.stroke();\n      x.fillStyle='#fff';x.font='900 38px \"Outfit\",sans-serif';x.fillText('VS',W/2,556);\n      const lead=val('sb-lead');x.font='800 30px \"Outfit\",sans-serif';const lw=x.measureText(lead).width+60;rrect(x,W/2-lw/2,776,lw,56,28);x.fillStyle='rgba(245,158,11,.16)';x.fill();x.strokeStyle='rgba(245,158,11,.5)';x.lineWidth=2;x.stroke();x.fillStyle='#facc15';x.fillText(lead,W/2,814);\n      rrect(x,70,876,W-140,340,24);x.fillStyle='rgba(255,255,255,.04)';x.fill();x.strokeStyle='rgba(255,255,255,.1)';x.lineWidth=2;x.stroke();\n      x.fillStyle='#f59e0b';x.font='800 24px \"Outfit\",sans-serif';x.fillText(\"🎤  TODAY'S VERDICT\",W/2,930);\n      const hv=$('hum')&&getComputedStyle($('hum')).display!=='none';\n      let verdict=hv?val('hum-roast'):val('dc-txt').replace(/^\"|\"$/g,'');\n      if(!verdict)verdict=val('sv-t');\n      x.fillStyle='#e2e8f0';x.font='italic 28px \"Plus Jakarta Sans\",sans-serif';\n      const lines=wrapLines(x,verdict,W-210).slice(0,6);let ly=978;lines.forEach(l=>{x.fillText(l,W/2,ly);ly+=38;});\n      x.fillStyle='#64748b';x.font='800 24px \"Outfit\",sans-serif';x.fillText('🏟  THE GREAT JUNE WALK WAR  ·  2026',W/2,1270);\n      x.fillStyle='#3f4a5c';x.font='700 20px \"Plus Jakarta Sans\",sans-serif';x.fillText('30 days · 2 rivals · 1 year of suffering',W/2,1302);\n      c.toBlob(b=>{const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='walk-war-battle-card.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);toast('📸 Battle card saved — drop it in the chat!');},'image/png');\n    }\n\n    // wire up controls\n    $('sync-btn').addEventListener('click',()=>fetchData(false));\n    $('tab-r').addEventListener('click',()=>switchBadgeTab('r'));\n    $('tab-a').addEventListener('click',()=>switchBadgeTab('a'));\n    $('share-btn').addEventListener('click',()=>buildBattleCard());\n    $('rr-btn').addEventListener('click',()=>playReplay());\n\n    setTimeout(hideLoader,7000);\n    fetchData(false);\n    this._iv=setInterval(()=>fetchData(true),60000);\n  }\n  componentWillUnmount(){if(this._iv)clearInterval(this._iv);}\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
